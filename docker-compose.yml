# Local dev stack for Pipeline A.
#   docker compose up -d
#   -> Postgres on :5432 (schema auto-applied from db/migrations)
#   -> n8n on http://localhost:5678 (workflows persist in the n8n_data volume)
#
# The FastAPI receiver runs on your host via `make run` so you can hot-reload it.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gtm-postgres
    environment:
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: gtm
      POSTGRES_DB: gtm
    ports:
      # Host port is configurable so the container can coexist with a local
      # Postgres already bound to 5432. Set POSTGRES_HOST_PORT in .env.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - gtm_pgdata:/var/lib/postgresql/data
      # Files in this dir run once, in name order, on first boot.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm -d gtm"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: gtm-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=UTC
      - ROUTE_HOT_THRESHOLD=70
      - ROUTE_WARM_THRESHOLD=40
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gtm_pgdata:
  n8n_data:
